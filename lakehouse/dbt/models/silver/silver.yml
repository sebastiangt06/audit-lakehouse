version: 2

models:
  - name: audit_events
    description: >
      Deduplicated audit events: one row per event_id (first arrival = lowest kafka_offset).
      Iceberg, partitioned by day(occurred_at). Incremental merge on event_id with a 1h lookback
      on ingested_at; see the model header for the late-arrival and partition-pruning rationale.
    columns:
      - name: event_id
        description: UUIDv7 generated by the core; end-to-end identity.
        data_tests:
          - unique
          - not_null
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["transaction.registered"]
      - name: occurred_at
        description: Business time (UTC).
        data_tests:
          - not_null
      - name: tenant_id
        data_tests:
          - not_null
      - name: amount
        description: decimal(19,4), exact (cast from the payload string, never via double).
      - name: kafka_offset
        description: Offset of the first arrival (lineage for replay / forensics).
