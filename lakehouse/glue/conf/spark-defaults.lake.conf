
# =====================================================================================================
# audit-lakehouse: appended to the Glue 5.0 image's /etc/spark/conf/spark-defaults.conf (last key wins)
# =====================================================================================================

# --- Never talk to AWS locally -------------------------------------------------------------------
# The image ships spark.sql.catalogImplementation=hive + hive-site.xml with
# AWSGlueDataCatalogHiveClientFactory, i.e. spark_catalog = AWS Glue Data Catalog. "in-memory"
# means the Hive/Glue client is never instantiated; every table lives in the `lake` catalog.
# (AWS_EC2_METADATA_DISABLED=true in compose also stops credential lookups against EC2 IMDS.)
spark.sql.catalogImplementation         in-memory
spark.sql.defaultCatalog                lake
# The image logs events to /var/log/spark/apps (Glue history server); not needed locally.
spark.eventLog.enabled                  false

# --- Iceberg catalog `lake`: REST catalog + S3FileIO on SeaweedFS ------------------------------------
spark.sql.extensions                    org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                  org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type             rest
spark.sql.catalog.lake.uri              http://iceberg-rest:8181
spark.sql.catalog.lake.io-impl          org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.s3.endpoint      http://seaweedfs:8333
spark.sql.catalog.lake.s3.path-style-access  true
spark.sql.catalog.lake.client.region    us-east-1
# Credentials are NOT in this file: S3FileIO uses the AWS SDK default chain, which reads
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (dummy values from .env). In AWS Glue the same chain
# picks up the job's IAM role, so no code or config change is needed for credentials.

# --- PRODUCTION (only configuration changes; the jobs stay the same) ---------------------------------
# (a) AWS Glue Iceberg REST endpoint, same REST protocol, SigV4 auth:
# spark.sql.catalog.lake.type                 rest
# spark.sql.catalog.lake.uri                  https://glue.us-east-1.amazonaws.com/iceberg
# spark.sql.catalog.lake.warehouse            <aws-account-id>
# spark.sql.catalog.lake.rest.sigv4-enabled   true
# spark.sql.catalog.lake.rest.signing-name    glue
# spark.sql.catalog.lake.rest.signing-region  us-east-1
# spark.sql.catalog.lake.io-impl              org.apache.iceberg.aws.s3.S3FileIO
#   (remove s3.endpoint and s3.path-style-access: real S3)
#
# (b) Native Glue Data Catalog client:
# spark.sql.catalog.lake                      org.apache.iceberg.spark.SparkCatalog
# spark.sql.catalog.lake.catalog-impl         org.apache.iceberg.aws.glue.GlueCatalog
# spark.sql.catalog.lake.warehouse            s3://<bucket>/warehouse/
# spark.sql.catalog.lake.io-impl              org.apache.iceberg.aws.s3.S3FileIO
#   (and drop `type`, `uri`, `s3.endpoint`, `s3.path-style-access`)

# --- Kafka connector for Structured Streaming ------------------------------------------------------
# Already in the image (AWS builds for Spark 3.5.4 / Scala 2.12, the ones Glue streaming uses),
# just not on the default classpath. Local files: no --packages, no download at runtime.
spark.jars  /usr/lib/spark/connector/lib/spark-sql-kafka-0-10_2.12-3.5.4-amzn-0.jar,/usr/lib/spark/connector/lib/spark-token-provider-kafka-0-10_2.12-3.5.4-amzn-0.jar,/usr/share/aws/glue-streaming/lib/kafka-clients-3.4.1.jar,/usr/share/aws/glue-streaming/lib/commons-pool2-2.11.1.jar

# --- Local mode sizing (container mem_limit 2g, see docker-compose.yml) -----------------------------
spark.master                            local[*]
spark.driver.memory                     1g
# Default 200 would mean up to 200 tasks (and files) per write; the PoC volume needs a handful.
spark.sql.shuffle.partitions            4
spark.sql.session.timeZone              UTC
