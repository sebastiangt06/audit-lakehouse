# Core OLTP, read for reconciliation (outbox dispatched vs lakehouse: assert_no_event_loss).
# uniqueidentifier is mapped to char(36) (upper case): normalize with lower() before comparing.
# PoC uses sa; in production this is a read-only login on the outbox schema only.
connector.name=sqlserver
connection-url=jdbc:sqlserver://sqlserver:1433;databaseName=${ENV:CORE_DB};encrypt=true;trustServerCertificate=true
connection-user=sa
connection-password=${ENV:SA_PASSWORD}
