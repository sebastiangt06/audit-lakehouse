# Iceberg lakehouse through the REST catalog (~ AWS Glue Iceberg REST endpoint in prod, ADR-007).
# Reads/writes the same tables the Glue 5.0 jobs write (Iceberg 1.7.1). ${ENV:...} comes from .env.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD

# Trino native S3 filesystem (no Hadoop S3A) against SeaweedFS.
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.path-style-access=true
s3.region=${ENV:AWS_REGION}
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
