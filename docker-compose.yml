# Audit Offloading Lakehouse — local PoC.
# All images pinned (never `latest`) and verified with `docker manifest inspect`.
# Variables come from .env (cp .env.example .env).

name: audit-lakehouse

services:
  # ---------------------------------------------------------------------------
  # Core OLTP + transactional outbox
  # ---------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
    platform: linux/amd64 # SQL Server is amd64-only (Rosetta on Apple Silicon)
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID}
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      # Keep SQL Server below the container limit; otherwise it sizes its buffer pool
      # from host RAM and gets OOM-killed.
      MSSQL_MEMORY_LIMIT_MB: "1536"
    mem_limit: 2g
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -b -Q 'SELECT 1' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot: idempotent schema + legacy audit.AuditLog seed (reuses the sqlserver image for sqlcmd).
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      CORE_DB: ${CORE_DB}
    volumes:
      - ./infra/sqlserver/init.sql:/init/init.sql:ro
    entrypoint: ["bash", "-c"]
    # -I: QUOTED_IDENTIFIER ON (filtered indexes). -b: non-zero exit on any SQL error.
    command:
      - |
        set -euo pipefail
        /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$$SA_PASSWORD" \
          -b -I -v CORE_DB="$$CORE_DB" -i /init/init.sql
    restart: "no"

  # ---------------------------------------------------------------------------
  # Transactional API (.NET 10): business change + outbox row in one transaction
  # ---------------------------------------------------------------------------
  core-api:
    build:
      context: ./src/dotnet
      target: api
    image: audit-lakehouse/core:local
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Core: "Server=sqlserver,1433;Database=${CORE_DB};User Id=sa;Password=${SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
    ports:
      - "${CORE_API_PORT}:8080"
    healthcheck:
      # Chiseled image: no shell/curl. The app binary probes its own /health.
      test: ["CMD", "dotnet", "/app/Makers.Core.Api.dll", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Outbox relay: SAME image as core-api, Role=Relay (ADR-002).
  # Lease-based claim, publish with no open transaction, ack per message. At-least-once.
  # ---------------------------------------------------------------------------
  outbox-relay:
    build:
      context: ./src/dotnet
      target: api
    image: audit-lakehouse/core:local
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      Role: Relay
      ConnectionStrings__Core: "Server=sqlserver,1433;Database=${CORE_DB};User Id=sa;Password=${SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Kafka__BootstrapServers: ${KAFKA_BOOTSTRAP}
      Kafka__AuditTopic: ${AUDIT_TOPIC}
    healthcheck:
      test: ["CMD", "dotnet", "/app/Makers.Core.Api.dll", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Load generator (profile "tools": never started by `up`, only by `make load`).
  # Own target of the same Dockerfile; args: --count N --parallel P [--base-url URL].
  # ---------------------------------------------------------------------------
  loadgen:
    build:
      context: ./src/dotnet
      target: loadgen
    image: audit-lakehouse/loadgen:local
    profiles: ["tools"]
    depends_on:
      core-api:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # Durable buffer + replay window (KRaft, single node)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.3.2
    environment:
      CLUSTER_ID: "mK3rS0audItLakeHouse01"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-init (partitions/retention are a design decision).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.3.2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      AUDIT_TOPIC: ${AUDIT_TOPIC}
      LOGS_TOPIC: ${LOGS_TOPIC}
    entrypoint: ["bash", "-c"]
    # Idempotent: --if-not-exists. Audit: 7 days (replay window, ADR-008). Logs: 3 days.
    command:
      - |
        set -euo pipefail
        T=/opt/kafka/bin/kafka-topics.sh
        $$T --bootstrap-server "$$BOOTSTRAP" --create --if-not-exists --topic "$$AUDIT_TOPIC" \
          --partitions 6 --replication-factor 1 \
          --config retention.ms=604800000 --config cleanup.policy=delete
        $$T --bootstrap-server "$$BOOTSTRAP" --create --if-not-exists --topic "$$LOGS_TOPIC" \
          --partitions 3 --replication-factor 1 \
          --config retention.ms=259200000 --config cleanup.policy=delete
        $$T --bootstrap-server "$$BOOTSTRAP" --describe --topic "$$AUDIT_TOPIC"
        $$T --bootstrap-server "$$BOOTSTRAP" --describe --topic "$$LOGS_TOPIC"
    restart: "no"

  # ---------------------------------------------------------------------------
  # S3-compatible object storage (stands in for Amazon S3)
  # ---------------------------------------------------------------------------
  seaweedfs:
    image: chrislusf/seaweedfs:4.55
    # Credentials in s3.json must match S3_ACCESS_KEY / S3_SECRET_KEY in .env.
    command: >
      server -dir=/data -ip.bind=0.0.0.0 -volume.max=0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  storage-init:
    image: amazon/aws-cli:2.42.4
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_ENDPOINT: ${S3_ENDPOINT}
      BUCKET: ${WAREHOUSE_BUCKET}
    entrypoint: ["bash", "-c"]
    # Idempotent: create the bucket only if it does not exist.
    command:
      - |
        set -euo pipefail
        if aws --endpoint-url "$$S3_ENDPOINT" s3api head-bucket --bucket "$$BUCKET" 2>/dev/null; then
          echo "bucket $$BUCKET already exists"
        else
          aws --endpoint-url "$$S3_ENDPOINT" s3 mb "s3://$$BUCKET"
        fi
        aws --endpoint-url "$$S3_ENDPOINT" s3 ls
    restart: "no"

  # ---------------------------------------------------------------------------
  # Iceberg REST catalog (~ AWS Glue Data Catalog / Glue Iceberg REST endpoint in prod)
  # 1.8.1 = closest published fixture to Glue 5.0's Iceberg 1.7.1 (no 1.7.x image exists).
  # ---------------------------------------------------------------------------
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.8.1
    depends_on:
      storage-init:
        condition: service_completed_successfully
    environment:
      # CATALOG_* env vars map to catalog properties: "__" -> "-", "_" -> "."
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      # Persisted sqlite catalog (image default is in-memory and is lost on restart).
      # /home/iceberg is owned by the image user, so the named volume inherits that ownership.
      CATALOG_URI: jdbc:sqlite:/home/iceberg/iceberg_catalog.db
      CATALOG_WAREHOUSE: s3://${WAREHOUSE_BUCKET}/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: ${S3_ENDPOINT}
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: ${AWS_REGION}
    ports:
      - "8181:8181"
    volumes:
      - iceberg-catalog:/home/iceberg
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8181/v1/config > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ---------------------------------------------------------------------------
  # AWS Glue 5.0 (official image, Spark local[*]): Kafka -> Iceberg bronze (ADR-011)
  # mem_limit 2g: spark.driver.memory=1g (JVM heap; local mode runs driver + executors in it)
  # + metaspace/off-heap/Netty + the Python worker ~= 1.6 GB; 2g leaves headroom without
  # starving SQL Server (2g) and Kafka on an 8 GB host.
  # ---------------------------------------------------------------------------
  glue-ingest:
    build:
      context: ./lakehouse/glue
    image: audit-lakehouse/glue:local
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      iceberg-rest:
        condition: service_healthy
    environment: &glue-env
      # Dummy local credentials (S3FileIO default chain). In AWS Glue: the job's IAM role.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: ${AWS_REGION}
      # Never query the EC2 metadata endpoint for credentials/region (we are not on AWS).
      AWS_EC2_METADATA_DISABLED: "true"
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      AUDIT_TOPIC: ${AUDIT_TOPIC}
      INGEST_TRIGGER_SECONDS: ${INGEST_TRIGGER_SECONDS}
      MAX_OFFSETS_PER_TRIGGER: ${MAX_OFFSETS_PER_TRIGGER}
      CHECKPOINT_DIR: /checkpoints/audit_bronze
    command: ["spark-submit", "jobs/ingest_audit_stream.py", "--JOB_NAME", "ingest_audit_stream"]
    volumes:
      - glue-checkpoints:/checkpoints
    mem_limit: 2g
    # A failed query exits the container; on restart it resumes from the checkpoint (no loss, no dup).
    restart: on-failure

  # One-off Glue jobs and spark-sql (maintenance, backfill, demos):
  #   docker compose run --rm glue-jobs spark-submit jobs/create_tables.py --JOB_NAME create_tables
  #   docker compose run --rm glue-jobs spark-sql -e "select count(*) from lake.audit.events_bronze"
  glue-jobs:
    build:
      context: ./lakehouse/glue
    image: audit-lakehouse/glue:local
    profiles: ["tools"]
    depends_on:
      iceberg-rest:
        condition: service_healthy
    environment: *glue-env
    volumes:
      - glue-checkpoints:/checkpoints
    mem_limit: 2g
    restart: "no"

  # ---------------------------------------------------------------------------
  # Trino: SQL engine for dbt over Iceberg + `sqlserver` catalog for reconciliation (ADR-009)
  # mem_limit 1536m: -Xmx1G heap (infra/trino/jvm.config) + 256M code cache + metaspace/direct
  # buffers. Query memory per node defaults to 30% of heap: plenty for the PoC volume.
  # ---------------------------------------------------------------------------
  trino:
    image: trinodb/trino:484
    depends_on:
      iceberg-rest:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
    environment:
      # Referenced as ${ENV:...} in infra/trino/catalog/*.properties.
      AWS_REGION: ${AWS_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      CORE_DB: ${CORE_DB}
      SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "${TRINO_PORT}:8080"
    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog:ro
      - ./infra/trino/jvm.config:/etc/trino/jvm.config:ro
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  # dbt (dbt-core + dbt-trino): staging -> silver -> gold + data quality tests.
  #   docker compose run --rm dbt build | docker compose run --rm dbt docs generate
  # The project is bind-mounted so docs (target/) land on the host (git-ignored).
  dbt:
    build:
      context: ./lakehouse/dbt
    image: audit-lakehouse/dbt:local
    profiles: ["tools"]
    depends_on:
      trino:
        condition: service_healthy
    environment:
      TRINO_HOST: trino
      TRINO_HTTP_PORT: "8080"
      DBT_CATALOG: lake
    volumes:
      - ./lakehouse/dbt:/usr/app
    restart: "no"

volumes:
  sqlserver-data:
  kafka-data:
  seaweedfs-data:
  iceberg-catalog:
  glue-checkpoints:
